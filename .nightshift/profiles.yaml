codex:
  agent_kind: codex
  # Uses default OAuth authentication

codex-gpt54:
  agent_kind: codex
  env:
    CODEX_MODEL: gpt-5.4
    CODEX_API_KEY: $OPENAI_API_KEY

codex-gpt54mini:
  agent_kind: codex
  env:
    CODEX_MODEL: gpt-5.4-mini
    CODEX_API_KEY: $OPENAI_API_KEY

opencode-gpt54:
  agent_kind: opencode
  extra_args: ["-m", "openai/gpt-5.4"]
  env:
    OPENAI_API_KEY: $OPENAI_API_KEY

opencode-gpt54mini:
  agent_kind: opencode
  extra_args: ["-m", "openai/gpt-5.4-mini"]
  env:
    OPENAI_API_KEY: $OPENAI_API_KEY
